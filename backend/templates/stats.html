<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>25-26 Win Predictor</title>

        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />



        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400..900&display=swap" rel="stylesheet">
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
  <body>

    <div id="champion-prediction">
      <h2>Predicted La Liga 2025–26 Champion 🏆</h2>
      <p id="winner"></p>
      <h3>Top 5 Predicted Contenders:</h3>
      <ul id="top5"></ul>
    </div>

    <aside class="sidebar">
            <!--- Sidebar Header -->
            <header class="sidebar-header">
                <a href="#" class="header-logo">
                    <img src="logo.png" alt="La Liga Logo" class="logo-img">
                </a>

                <button class="sidebar-toggle">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
            </header>
            <nav class="sidebar-nav">
                <ul class="nav-list primary-nav">
                    <li class="nav-item">
                        <a href="home.html" class="nav-link">
                            <span class="material-symbols-outlined">home</span>
                            <span class="nav-label">HOME</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li class="nav-item">
                                <a href="home.html" class="nav-link dropdown-link">Home</a>
                            </li>
                            <li class="nav-item">
                                <a href="stats.html" class="nav-link dropdown-link">Predictions</a>
                            </li>
                        </ul>
                    </li>

                    <!-- Dropdown -->
                    <li class="nav-item dropdown-container">
                        <a href="#" class="nav-link dropdown-toggle">
                            <span class="material-symbols-outlined">group</span>
                            <span class="nav-label">TEAMS</span>
                            <span class="dropdown-icon material-symbols-outlined">keyboard_arrow_down</span>
                        </a>
                        <!-- Dropdown Menu -->
                        <ul class="dropdown-menu">
                            <li class="nav-item">
                                <a href="teams.html" class="nav-link dropdown-link">All Teams</a>
                            </li>
                            <li class="nav-item">
                                <a href="real-madrid-players.html" class="nav-link dropdown-link">Real Madrid</a>
                            </li>
                            <li class="nav-item">
                                <a href="barcelona-players.html" class="nav-link dropdown-link">Barcelona</a>
                            </li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a href="stats.html" class="nav-link">
                            <span class="material-symbols-outlined">trophy</span>
                            <span class="nav-label">PREDICTIONS</span>
                        </a>
                    <ul class="dropdown-menu">
                    <li class="nav-item">
                        <a href="stats.html" class="nav-link dropdown-link">Predictions</a>
                    </li>
                </ul>
            </li>
        </nav>
    </aside>
  </body>

  <script src="script.js"></script>

  <script>
    fetch("../data/predicted_champions.json")
      .then((response) => response.json())
      .then((data) => {
        // Display winner
        const winnerEl = document.getElementById("winner");
        winnerEl.textContent = `${data.predicted_winner.team} - Winning Probability: ${data.predicted_winner.probability}%`;

        // Display top 5 contenders
        const top5El = document.getElementById("top5");
        data.top5_contenders.forEach((contender) => {
          const li = document.createElement("li");
          li.textContent = `${contender.squad} - ${contender[
            "combined_prob (%)"
          ].toFixed(2)}%`;
          top5El.appendChild(li);
        });
      })
      .catch((err) => console.error("Error loading prediction data:", err));
  </script>
</html>
